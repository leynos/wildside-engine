[package]
name = "wildside-cli"
version = "0.1.0"
edition.workspace = true
publish = false
default-run = "wildside"

[[bin]]
name = "wildside"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
eyre = "0.6"
ortho_config = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "1.0.69"
bzip2 = "0.4"
wildside-core = { path = "../wildside-core", default-features = false, features = ["serde"] }
wildside-data = { workspace = true }
wildside-scorer = { workspace = true }
wildside-solver-vrp = { workspace = true, optional = true }
wildside-solver-ortools = { workspace = true, optional = true }
camino = { workspace = true }
cap-std = { workspace = true }
wildside-fs = { path = "../wildside-fs" }

[dev-dependencies]
base64 = "0.22"
geo = { workspace = true }
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
tempfile = "3.23.0"
rusqlite = { workspace = true }

[features]
default = ["solver-vrp", "store-sqlite"]
solver-vrp = ["dep:wildside-solver-vrp"]
solver-ortools = ["dep:wildside-solver-ortools"]
store-sqlite = ["wildside-core/store-sqlite"]

[lints.clippy]
# This package does not yet inherit the workspace lint table; #124 tracks that
# migration. Deny the environment-access rule here so #126's policy holds in
# every package today, and fold this into `[lints] workspace = true` when #124
# lands.
#
# The two hygiene lints come with it. Without them an item-scoped
# `#[allow(clippy::disallowed_methods)]` would silently lower the deny, leaving
# the sanctioned, reasoned `#[expect(..)]` as the only escape in the inheriting
# packages but not here.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"
