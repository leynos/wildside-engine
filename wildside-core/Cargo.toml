[package]
name = "wildside-core"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
geo = { workspace = true }
rstar = { version = "0.12.0" }
rusqlite = { workspace = true, optional = true }
thiserror = "1"
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
bincode = { version = "1", optional = true }
cap-std = { workspace = true, optional = true }

[dev-dependencies]
# Parameterised tests rely on rstest macros.
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
tempfile = "3"

[features]
default = ["serde", "store-sqlite"]
serde = ["dep:serde", "dep:serde_json", "geo/use-serde", "rstar/serde"]
store-sqlite = ["serde", "dep:bincode", "dep:cap-std", "dep:rusqlite"]
test-support = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
# This package does not yet inherit the workspace lint table; #124 tracks that
# migration. Deny the environment-access rule here so #126's policy holds in
# every package today, and fold this into `[lints] workspace = true` when #124
# lands.
#
# The two hygiene lints come with it. Without them an item-scoped
# `#[allow(clippy::disallowed_methods)]` would silently lower the deny, leaving
# the sanctioned, reasoned `#[expect(..)]` as the only escape in the inheriting
# packages but not here.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"
