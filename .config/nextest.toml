# .config/nextest.toml
[profile.default]
# Kill any test once it crosses 60s.
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "5s" }

# Put a hard ceiling on the whole run.
global-timeout = "10m"


# The Clippy environment-policy probe starts a nested `cargo clippy` over the
# fixture crate. The `nested-cargo` group serialises the tests placed in it, so
# two nested compiler runs never contend for the shared fixture target
# directory; tests outside the group still run alongside them. The override's
# total allowance (period x terminate-after) stays below `global-timeout`.
[test-groups.nested-cargo]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(clippy_env_policy_ui_tests)'
test-group = 'nested-cargo'
slow-timeout = { period = "120s", terminate-after = 2, grace-period = "5s" }
