name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MERMAN_CLI_VERSION: '0.7.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: leynos/shared-actions/.github/actions/setup-rust@7f453d1cb78953489bd9da9409bf385c44b224a3
        with:
          # The build standard links with `mold` on Linux (.cargo/config.toml and
          # the Makefile's gate recipes), so the linker must be installed.
          install-mold: 'true'
          expect-cache: any
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@848136c5ba4ea848a76ce75b8babe954359c4381
        with:
          tool: cargo-nextest
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@7f453d1cb78953489bd9da9409bf385c44b224a3
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt
      - name: Install the Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@7f453d1cb78953489bd9da9409bf385c44b224a3
      # `make lint` runs the docstring gate through `uv tool run`, so uv must be
      # set up before it.
      - name: Install uv
        id: setup-uv
        # v6.4.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: '3.14'
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Lint
        run: make lint
      # The coverage step below (and coverage-main.yml on a push) runs every
      # target `make test` selects except the benches, under the same
      # features and nextest profile, so running `make test` here as well
      # ran 385 tests twice. Only the bench targets are left to this step.
      # tests/workflow_contracts/suite_runs_once_test.py holds the split.
      - name: Fetch dependencies
        # Tests start their own cargo offline; fetch once so none resolves cold.
        run: cargo fetch --locked
      - name: Test benchmark targets
        run: make test-benches
      # nextest's own report of the effective test groups: the nested Clippy
      # probe must sit in the one-thread group. This is a check on the
      # configuration as nextest applies it, not a test.
      - name: Check the nested-cargo test group
        run: |
          set -euo pipefail
          # The report is read by awk and grep, so strip any colour codes.
          report="$(cargo nextest show-config test-groups | sed 's/\x1b\[[0-9;]*m//g')"
          printf '%s\n' "$report"
          group="$(printf '%s\n' "$report" | awk '/^group: /{keep = ($0 ~ /^group: nested-cargo \(max threads = 1\)$/)} keep')"
          test -n "$group"
          printf '%s\n' "$group" | grep -q 'wildside-engine::clippy_env_policy_ui_tests:'
      - name: Generate coverage
        # Pull requests ratchet against the baseline coverage-main.yml writes
        # on main and never contact CodeScene; that workflow is the one
        # publisher. Measuring here on the push to main as well would write a
        # second baseline. tests/workflow_contracts holds the shape.
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@7f453d1cb78953489bd9da9409bf385c44b224a3
        with:
          output-path: lcov.info
          format: lcov
          features: test-support
          use-cargo-nextest: 'true'
          with-ratchet: 'true'
          # A new path starts a new baseline: the cache entry's version hashes
          # this path, so the restore misses the figure measured on the previous
          # toolchain and the committed file sets the baseline.
          baseline-rust-file: .coverage-baseline-v2.rust
          publish-artefact: 'false'
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'
      - name: Enforce en-GB-oxendict spelling
        run: make spelling
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.21"
      - name: Install and verify Mermaid CLI
        run: |
          set -euxo pipefail
          bun install --global @mermaid-js/mermaid-cli@11.9.0
          bun x puppeteer browsers install chrome-headless-shell
          mmdc --version
      - name: Install diagram tooling
        run: |
          set -euxo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          uv tool install --python 3.14 nixie-cli==1.1.0
          cargo +1.95.0 install merman-cli \
            --version "=${MERMAN_CLI_VERSION}" --locked
      - name: Validate diagrams
        run: make nixie
      - name: Debug CLI versions
        if: ${{ failure() }}
        run: |
          set -euxo pipefail
          which mmdc
          mmdc --version
          bun --version

  feature-matrix:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: explicit-defaults
            test_flags: "--no-default-features --features solver-vrp,store-sqlite"
          - name: no-default-features
            test_flags: "--no-default-features"
          - name: all-features
            test_flags: "--all-features"
          - name: solver-vrp-only
            test_flags: "--no-default-features --features solver-vrp"
          - name: solver-ortools-only
            test_flags: "--no-default-features --features solver-ortools"
          - name: store-sqlite-only
            test_flags: "--no-default-features --features store-sqlite"
          - name: solvers-only
            test_flags: "--no-default-features --features solver-vrp,solver-ortools"
          - name: solver-ortools-and-store
            test_flags: "--no-default-features --features solver-ortools,store-sqlite"
    steps:
      # Intentional duplication with the build job keeps the matrix
      # self-contained; refactor to a composite action if this grows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: leynos/shared-actions/.github/actions/setup-rust@7f453d1cb78953489bd9da9409bf385c44b224a3
        with:
          # The build standard links with `mold` on Linux (.cargo/config.toml and
          # the Makefile's gate recipes), so the linker must be installed.
          install-mold: 'true'
          expect-cache: any
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@848136c5ba4ea848a76ce75b8babe954359c4381
        with:
          tool: cargo-nextest
      - name: Fetch dependencies
        # Tests start their own cargo offline; fetch once so none resolves cold.
        run: cargo fetch --locked
      - name: Test (${{ matrix.name }})
        run: |
          echo "TEST_FLAGS=${TEST_FLAGS}"
          make test
        env:
          TEST_FLAGS: ${{ matrix.test_flags }}
