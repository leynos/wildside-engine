name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MERMAN_CLI_VERSION: '0.7.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: leynos/shared-actions/.github/actions/setup-rust@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          expect-cache: any
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@848136c5ba4ea848a76ce75b8babe954359c4381
        with:
          tool: cargo-nextest
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@ff1dd759dfffc0db3459e30e833f52437ee62b57
        with:
          version: "0.6.0"

      - name: Check formatting
        run: make check-fmt
      - name: Install the Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@7d751eded578e48dacf43ab173d5820e6437c474
      - name: Lint
        run: make lint
      # The coverage step below (and coverage-main.yml on a push) runs every
      # target `make test` selects except the benches, under the same
      # features and nextest profile, so running `make test` here as well
      # ran 385 tests twice. Only the bench targets are left to this step.
      # tests/workflow_contracts/suite_runs_once_test.py holds the split.
      - name: Test benchmark targets
        run: make test-benches
      - name: Generate coverage
        # Pull requests ratchet against the baseline coverage-main.yml writes
        # on main and never contact CodeScene; that workflow is the one
        # publisher. Measuring here on the push to main as well would write a
        # second baseline. tests/workflow_contracts holds the shape.
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          output-path: lcov.info
          format: lcov
          features: test-support
          use-cargo-nextest: 'true'
          with-ratchet: 'true'
          publish-artefact: 'false'
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
      - name: Install uv
        id: setup-uv
        # v6.4.3
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.14'
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Enforce en-GB-oxendict spelling
        run: make spelling
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.21"
      - name: Install and verify Mermaid CLI
        run: |
          set -euxo pipefail
          bun install --global @mermaid-js/mermaid-cli@11.9.0
          bun x puppeteer browsers install chrome-headless-shell
          mmdc --version
      - name: Install diagram tooling
        run: |
          set -euxo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          uv tool install --python 3.14 nixie-cli==1.1.0
          cargo +1.95.0 install merman-cli \
            --version "=${MERMAN_CLI_VERSION}" --locked
      - name: Validate diagrams
        run: make nixie
      - name: Debug CLI versions
        if: ${{ failure() }}
        run: |
          set -euxo pipefail
          which mmdc
          mmdc --version
          bun --version

  feature-matrix:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: explicit-defaults
            test_flags: "--no-default-features --features solver-vrp,store-sqlite"
          - name: no-default-features
            test_flags: "--no-default-features"
          - name: all-features
            test_flags: "--all-features"
          - name: solver-vrp-only
            test_flags: "--no-default-features --features solver-vrp"
          - name: solver-ortools-only
            test_flags: "--no-default-features --features solver-ortools"
          - name: store-sqlite-only
            test_flags: "--no-default-features --features store-sqlite"
          - name: solvers-only
            test_flags: "--no-default-features --features solver-vrp,solver-ortools"
          - name: solver-ortools-and-store
            test_flags: "--no-default-features --features solver-ortools,store-sqlite"
    steps:
      # Intentional duplication with the build job keeps the matrix
      # self-contained; refactor to a composite action if this grows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: leynos/shared-actions/.github/actions/setup-rust@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          expect-cache: any
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@848136c5ba4ea848a76ce75b8babe954359c4381
        with:
          tool: cargo-nextest
      - name: Test (${{ matrix.name }})
        run: |
          echo "TEST_FLAGS=${TEST_FLAGS}"
          make test
        env:
          TEST_FLAGS: ${{ matrix.test_flags }}
